<style>
/* Layout: full-bleed satellite map + docked control rail (right on desktop, bottom sheet on phone) */
:root {
  --bg: #f3f4f1;
  --panel: #fbfbf9;
  --fg: #1d2120;
  --muted: #5d6662;
  --line: #d6dbd7;
  --accent: #d6311f;        /* kerb red */
  --accent-fg: #ffffff;
  --field: #ffffff;
  --sel: #f2b705;           /* selection / marshal yellow */
  --font-display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121514; --panel: #1a1e1d; --fg: #e7ebe8; --muted: #9aa49f; --line: #2e3533;
    --accent: #ef4a36; --accent-fg: #ffffff; --field: #222826; --sel: #f2c230; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); display: grid; grid-template-columns: 1fr 340px; }
#map { height: 100%; min-height: 0; background: #20262a; }
#map.placing { cursor: crosshair; }
aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { order: 1; }
.quick-actions { order: 2; }
.pane { order: 3; }
.tabs { order: 4; }
.brand { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font: 700 20px/1.1 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.brand .meta { margin-top: 4px; font: 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: flex; border-bottom: 1px solid var(--line); pointer-events: auto; }
.tabs button { flex: 1; padding: 14px 8px; border: 0; background: none; color: var(--muted); font: 700 14px var(--font-display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; [...]
.tabs button:hover { color: var(--fg); background: rgba(0,0,0,0.02); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; min-height: 0; flex: 1; }
.quick-actions { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.quick-btn { flex: 1; min-width: 80px; font-size: 12px; padding: 8px 12px; }
.group { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--field); border-radius: 8px; border: 1px solid var(--line); }
.group > h2 { margin: 0; font: 700 14px var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row label { flex: 1; min-width: 0; }
.unit { font: 12px var(--font-mono); color: var(--muted); min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { flex: 1.4; min-width: 120px; accent-color: var(--accent); }
input[type=number], input[type=text], select {
  font: 13px var(--font-body); color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0;
}
input[type=number] { width: 64px; font-family: var(--font-mono); }
.btn { font: 600 14px var(--font-body); padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--fg); cursor: pointer; transition: all 0.2s eas[...]
.btn:hover { border-color: var(--muted); transform: translateY(-1px); box-shadow: 0 3px 6px rgba(0,0,0,0.12); }
.btn:active { transform: translateY(0); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.btn.primary:hover { background: #e6402e; border-color: #e6402e; }
.btn.small { padding: 6px 12px; font-size: 13px; min-height: 32px; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
table.sections { width: 100%; border-collapse: collapse; font-size: 12px; }
table.sections th { text-align: left; font: 500 11px var(--font-mono); color: var(--muted); padding: 2px 2px 4px; }
table.sections td { padding: 2px; }
table.sections input { width: 100%; padding: 4px 5px; }
.palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.palette button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border: 2px solid var(--line); border-radius: 8px; background: var(--field); color: v[...]
.palette button:hover { border-color: var(--muted); transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.palette button[aria-pressed="true"] { border-color: var(--accent); background: rgba(214, 49, 31, 0.05); box-shadow: 0 0 0 2px var(--accent); }
.palette svg { width: 30px; height: 30px; }
.selbox { border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.palette svg { width: 30px; height: 30px; }
.selbox { border: 1px solid var(--line); border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.eq-icon { background: none; border: 0; }
.eq-icon .rot { width: 100%; height: 100%; transform-origin: 50% 50%; }
.eq-icon.selected .rot { filter: drop-shadow(0 0 2px var(--sel)) drop-shadow(0 0 4px var(--sel)); }
.edge-handle { background: none; border: 0; }
.edge-handle span { display: block; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; border: 2px solid #1d2120; box-shadow: 0 0 0 1px rgba(255,255,255,.6); cursor: grab; }
.edge-handle.moved span { background: #d6311f; border-color: #ffffff; }
.edge-handle:active span { cursor: grabbing; transform: scale(1.25); }
.km-tag { background: rgba(20,24,23,.82); color: #fff; font: 500 11px var(--font-mono); padding: 1px 4px; border-radius: 3px; white-space: nowrap; border: 0; }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 50% 50%; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .brand { padding: 10px 12px 8px; }
  .brand h1 { font-size: 18px; }
  .tabs { order: 4; border-top: 1px solid var(--line); border-bottom: 0; position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); z-index: 99999; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs button { padding: 10px 6px; font-size: 12px; flex: 1; pointer-events: auto; border: none; background: transparent; cursor: pointer; }
  .tabs button#tab-menu { font-size: 18px; padding: 8px; }
  .quick-actions { padding: 8px 12px; }
  .quick-btn { font-size: 11px; padding: 6px 8px; min-width: 60px; }
  .pane { padding: 12px; gap: 12px; padding-bottom: 80px; overflow-y: auto; }
  .group { padding: 12px; }
  .group > h2 { font-size: 13px; }
  .btn { padding: 8px 12px; font-size: 13px; min-height: 36px; }
  .btn.small { padding: 5px 10px; font-size: 11px; min-height: 28px; }
  .palette button { padding: 6px 2px 5px; font-size: 10px; }
  .palette svg { width: 24px; height: 24px; }
  
  /* Bottom Sheet */
  .bottom-sheet {
    display: block;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 16px;
    z-index: 2000;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .bottom-sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .bottom-sheet-header h3 { margin: 0; font-size: 16px; }
  .close-btn {
    background: none; border: none; font-size: 24px;
    color: var(--muted); cursor: pointer; padding: 8px;
  }
  .menu-item {
    width: 100%; padding: 16px;
    background: var(--field); border: 1px solid var(--line);
    border-radius: 8px;
    text-align: left;
    margin-bottom: 8px;
    font-size: 14px;
  }
  
}
/* Modal — applies on all screen sizes */
.modal {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
  z-index: 3000;
}
.modal.open { display: flex; }
.modal-content {
  background: var(--panel);
  border-radius: 12px;
  max-width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px;
  min-width: 320px;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.modal-header h2 { margin: 0; font-size: 18px; }
.close-btn { background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; padding: 8px; }
.modal-body { display: flex; flex-direction: column; gap: 16px; }
.modal-body .group h3 { font-size: 14px; margin-bottom: 8px; }
.modal-body ul { padding-left: 20px; margin: 0; }
.modal-body li { margin-bottom: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.pane { animation: fadeIn 0.3s ease; }
.brand h1 { animation: slideUp 0.4s ease; }
</style>
</head>
